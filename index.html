<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daaga · Ultra Space Simulation</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
}

/* TEXT */
.text-container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    pointer-events:none;
}

.glitch-text{
    font-size:clamp(3rem,12vw,7rem);
    font-weight:900;
    color:#fff;
    text-shadow:0 0 40px #fff;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

#bgCanvas{z-index:1;}
#fgCanvas{z-index:30;}
</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>
<canvas id="fgCanvas"></canvas>

<div class="text-container">
    <h1 class="glitch-text">Daaga</h1>
</div>

<script>

// ================= SETUP =================
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');

const fgCanvas = document.getElementById('fgCanvas');
const fgCtx = fgCanvas.getContext('2d');

function resize(){
    bgCanvas.width = innerWidth;
    bgCanvas.height = innerHeight;
    fgCanvas.width = innerWidth;
    fgCanvas.height = innerHeight;
}
window.addEventListener('resize', resize);

// ================= CENTER =================
function getCenter(){
    let r = document.querySelector(".glitch-text").getBoundingClientRect();
    return { x:r.left + r.width/2, y:r.top + r.height/2 };
}

// ================= PARTICLES =================
let particles = [];

class Particle{
    constructor(){ this.reset(); }

    reset(){
        let side = Math.floor(Math.random()*4);

        if(side===0){ this.x=Math.random()*fgCanvas.width; this.y=-20; }
        else if(side===1){ this.x=Math.random()*fgCanvas.width; this.y=fgCanvas.height+20; }
        else if(side===2){ this.x=-20; this.y=Math.random()*fgCanvas.height; }
        else{ this.x=fgCanvas.width+20; this.y=Math.random()*fgCanvas.height; }

        this.vx=(Math.random()-0.5)*2;
        this.vy=(Math.random()-0.5)*2;
        this.size=Math.random()*2+1;

        this.prevX=this.x;
        this.prevY=this.y;
    }

    update(){

        this.prevX=this.x;
        this.prevY=this.y;

        let c = getCenter();

        let dx = c.x - this.x;
        let dy = c.y - this.y;
        let dist = Math.hypot(dx,dy);

        let angle = Math.atan2(dy,dx);

        // MAIN BLACK HOLE
        let gravity = 1200 / (dist*dist + 80);
        this.vx += Math.cos(angle)*gravity;
        this.vy += Math.sin(angle)*gravity;

        let swirl = 0.8 / (dist*0.02 + 1);
        this.vx += Math.cos(angle + Math.PI/2)*swirl;
        this.vy += Math.sin(angle + Math.PI/2)*swirl;

        // PLANETS
        planets.forEach(p=>{
            let dx=p.x-this.x;
            let dy=p.y-this.y;
            let d=Math.hypot(dx,dy);

            if(d < 120){
                let a=Math.atan2(dy,dx);
                this.vx += Math.cos(a)*0.2;
                this.vy += Math.sin(a)*0.2;
            }
        });

        // MULTIPLE BLACK HOLES
        blackHoles.forEach(bh=>{
            let dx = bh.x - this.x;
            let dy = bh.y - this.y;
            let dist = Math.hypot(dx,dy);

            let a = Math.atan2(dy,dx);

            let force = bh.mass / (dist*dist + 50);

            this.vx += Math.cos(a)*force;
            this.vy += Math.sin(a)*force;

            // swirl
            this.vx += Math.cos(a + Math.PI/2)*0.5;
            this.vy += Math.sin(a + Math.PI/2)*0.5;

            // eat particle
            if(dist < bh.size){
                createExplosion(this.x,this.y);
                this.reset();
            }
        });

        this.x += this.vx;
        this.y += this.vy;

        if(dist < 6) this.reset();

        if(this.x < -50 || this.x > fgCanvas.width+50 ||
           this.y < -50 || this.y > fgCanvas.height+50){
            this.reset();
        }
    }

    draw(){
        fgCtx.strokeStyle="rgba(255,180,80,0.4)";
        fgCtx.lineWidth=this.size;
        fgCtx.beginPath();
        fgCtx.moveTo(this.prevX,this.prevY);
        fgCtx.lineTo(this.x,this.y);
        fgCtx.stroke();

        fgCtx.fillStyle="#ffaa33";
        fgCtx.beginPath();
        fgCtx.arc(this.x,this.y,this.size,0,Math.PI*2);
        fgCtx.fill();
    }
}

function initParticles(){
    particles=[];
    for(let i=0;i<700;i++) particles.push(new Particle());
}

// ================= PLANETS =================
let planets=[];

class Planet{
    constructor(r,dist,speed,color){
        this.r=r;
        this.dist=dist;
        this.angle=Math.random()*Math.PI*2;
        this.speed=speed;
        this.color=color;
    }

    update(cx,cy){
        this.angle+=this.speed;
        this.x=cx + Math.cos(this.angle)*this.dist;
        this.y=cy + Math.sin(this.angle)*this.dist;
    }

    draw(){
        let g=bgCtx.createRadialGradient(this.x,this.y,1,this.x,this.y,this.r);
        g.addColorStop(0,"#fff");
        g.addColorStop(1,this.color);

        bgCtx.fillStyle=g;
        bgCtx.beginPath();
        bgCtx.arc(this.x,this.y,this.r,0,Math.PI*2);
        bgCtx.fill();
    }
}

function initPlanets(){
    planets=[
        new Planet(10,200,0.01,"#ff5500"),
        new Planet(12,280,-0.008,"#00aaff"),
        new Planet(8,150,0.015,"#ffaa00"),
        new Planet(9,240,0.012,"#55ff88")
    ];
}

// ================= MULTIPLE BLACK HOLES =================
let blackHoles=[];

class BlackHole{
    constructor(){
        this.orbit = Math.random()>0.5;

        this.angle=Math.random()*Math.PI*2;
        this.dist=100+Math.random()*300;

        this.x=Math.random()*bgCanvas.width;
        this.y=Math.random()*bgCanvas.height;

        this.speed=(Math.random()*0.01+0.003)*(Math.random()>0.5?1:-1);
        this.size=8+Math.random()*10;
        this.mass=2000+Math.random()*3000;
    }

    update(cx,cy){
        if(this.orbit){
            this.angle+=this.speed;
            this.x=cx + Math.cos(this.angle)*this.dist;
            this.y=cy + Math.sin(this.angle)*this.dist;
        }else{
            this.x += Math.sin(Date.now()*0.001 + this.angle)*1.5;
            this.y += Math.cos(Date.now()*0.001 + this.angle)*1.5;
        }
    }

    draw(){
        let g=bgCtx.createRadialGradient(this.x,this.y,1,this.x,this.y,this.size*6);
        g.addColorStop(0,"#000");
        g.addColorStop(0.4,"rgba(255,100,0,0.5)");
        g.addColorStop(0.7,"rgba(0,150,255,0.3)");
        g.addColorStop(1,"transparent");

        bgCtx.fillStyle=g;
        bgCtx.beginPath();
        bgCtx.arc(this.x,this.y,this.size*6,0,Math.PI*2);
        bgCtx.fill();

        bgCtx.fillStyle="#000";
        bgCtx.beginPath();
        bgCtx.arc(this.x,this.y,this.size,0,Math.PI*2);
        bgCtx.fill();
    }
}

function initBlackHoles(){
    blackHoles=[];
    for(let i=0;i<6;i++) blackHoles.push(new BlackHole());
}

// ================= NUCLEI =================
let nuclei=[];

class Nucleus{
    constructor(){
        this.x=Math.random()*bgCanvas.width;
        this.y=Math.random()*bgCanvas.height;

        this.vx=(Math.random()-0.5)*8;
        this.vy=(Math.random()-0.5)*8;

        this.size=2+Math.random()*3;
    }

    update(){
        this.vx += (Math.random()-0.5)*0.5;
        this.vy += (Math.random()-0.5)*0.5;

        this.x += this.vx;
        this.y += this.vy;

        if(this.x<0||this.x>bgCanvas.width) this.vx*=-1;
        if(this.y<0||this.y>bgCanvas.height) this.vy*=-1;

        particles.forEach(p=>{
            let dx=p.x-this.x;
            let dy=p.y-this.y;
            let d=Math.hypot(dx,dy);

            if(d<80){
                let a=Math.atan2(dy,dx);
                p.vx += Math.cos(a)*0.8;
                p.vy += Math.sin(a)*0.8;
            }
        });
    }

    draw(){
        bgCtx.fillStyle="rgba(255,255,255,0.9)";
        bgCtx.beginPath();
        bgCtx.arc(this.x,this.y,this.size,0,Math.PI*2);
        bgCtx.fill();
    }
}

function initNuclei(){
    nuclei=[];
    for(let i=0;i<20;i++) nuclei.push(new Nucleus());
}

// ================= EXPLOSIONS =================
let explosions=[];

function createExplosion(x,y){
    for(let i=0;i<40;i++){
        explosions.push({
            x,y,
            vx:(Math.random()-0.5)*6,
            vy:(Math.random()-0.5)*6,
            life:60
        });
    }
}

function updateExplosions(){
    explosions.forEach(e=>{
        e.x+=e.vx;
        e.y+=e.vy;
        e.life--;
    });

    explosions = explosions.filter(e=>e.life>0);
}

function drawExplosions(){
    explosions.forEach(e=>{
        bgCtx.fillStyle=`rgba(255,150,50,${e.life/60})`;
        bgCtx.fillRect(e.x,e.y,2,2);
    });
}

// ================= BLACK HOLE VISUAL =================
function drawBlackHole(){
    let c=getCenter();

    let g=bgCtx.createRadialGradient(c.x,c.y,10,c.x,c.y,180);
    g.addColorStop(0,"#000");
    g.addColorStop(0.5,"#000");
    g.addColorStop(0.8,"rgba(255,120,0,0.25)");
    g.addColorStop(1,"rgba(0,150,255,0.2)");

    bgCtx.fillStyle=g;
    bgCtx.beginPath();
    bgCtx.arc(c.x,c.y,180,0,Math.PI*2);
    bgCtx.fill();
}

// ================= ANIMATION =================
function animate(){

    bgCtx.fillStyle="rgba(0,0,0,0.25)";
    bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

    let c=getCenter();

    planets.forEach(p=>{
        p.update(c.x,c.y);
        p.draw();
    });

    blackHoles.forEach(bh=>{
        bh.update(c.x,c.y);
        bh.draw();
    });

    nuclei.forEach(n=>{
        n.update();
        n.draw();
    });

    drawBlackHole();

    updateExplosions();
    drawExplosions();

    fgCtx.clearRect(0,0,fgCanvas.width,fgCanvas.height);

    particles.forEach(p=>{
        p.update();
        p.draw();
    });

    if(Math.random()<0.01){
        createExplosion(Math.random()*bgCanvas.width,Math.random()*bgCanvas.height);
    }

    requestAnimationFrame(animate);
}

// ================= START =================
resize();
initParticles();
initPlanets();
initBlackHoles();
initNuclei();
animate();

</script>

</body>
</html>
